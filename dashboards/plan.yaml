      - type: custom:button-card
        entity: weather.forecast_maison
        show_name: false
        show_state: false
        show_icon: false
        tap_action:
          action: more-info
        custom_fields:
          room: TERRASSE
          icon: |
            [[[
              const s = entity.state;
              const icons = {
                "clear-night": "mdi:weather-night",
                "cloudy": "mdi:weather-cloudy",
                "fog": "mdi:weather-fog",
                "hail": "mdi:weather-hail",
                "lightning": "mdi:weather-lightning",
                "lightning-rainy": "mdi:weather-lightning-rainy",
                "partlycloudy": "mdi:weather-partly-cloudy",
                "pouring": "mdi:weather-pouring",
                "rainy": "mdi:weather-rainy",
                "snowy": "mdi:weather-snowy",
                "snowy-rainy": "mdi:weather-snowy-rainy",
                "sunny": "mdi:weather-sunny",
                "windy": "mdi:weather-windy",
                "windy-variant": "mdi:weather-windy-variant",
                "exceptional": "mdi:alert-circle-outline"
              };
              const icon = icons[s] || "mdi:weather-partly-cloudy";
              return `<ha-icon icon="${icon}" style="width:30px;height:30px;color:white;opacity:0.92;"></ha-icon>`;
            ]]]
          temp: |
            [[[
              const t = entity.attributes.temperature;
              if (t === undefined || t === null) return "--";
              const n = Number(t);
              return isNaN(n) ? `${t}°` : `${n.toFixed(1).replace(".", ",")}°`;
            ]]]
          cond: |
            [[[
              const s = entity.state;
              const labels = {
                "clear-night": "Nuit claire",
                "cloudy": "Nuageux",
                "fog": "Brouillard",
                "hail": "Grêle",
                "lightning": "Orage",
                "lightning-rainy": "Orage",
                "partlycloudy": "Éclaircies",
                "pouring": "Forte pluie",
                "rainy": "Pluie",
                "snowy": "Neige",
                "snowy-rainy": "Neige / pluie",
                "sunny": "Ensoleillé",
                "windy": "Venteux",
                "windy-variant": "Venteux",
                "exceptional": "Alerte"
              };
              return labels[s] || s;
            ]]]
        styles:
          card:
            - width: 150px
            - height: 84px
            - padding: 0
            - border-radius: 18px
            - background: >-
                linear-gradient(180deg, rgba(24,24,24,0.93),
                rgba(10,10,10,0.90))
            - border: 1px solid rgba(255,255,255,0.08)
            - box-shadow: >-
                0 10px 26px rgba(0,0,0,0.34), inset 0 1px 0
                rgba(255,255,255,0.04)
            - overflow: hidden
          custom_fields:
