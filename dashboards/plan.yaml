title: Plan
icon: mdi:floor-plan
type: panel
cards:
  - type: picture-elements
    image: /api/image/serve/134433a7c0f18b3defa2a547b528e00f/original
    elements:
      - type: custom:button-card
        entity: sensor.lave_vaisselle_puissance
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: more-info
        custom_fields:
          icon: |
            [[[
              const power = parseFloat(entity.state);
              const running = !isNaN(power) && power > 5;
              const color = running ? "rgba(0,180,80,0.98)" : "rgba(220,40,40,0.98)";
              const shadow = running
                ? "drop-shadow(0 0 6px rgba(0,180,80,0.75))"
                : "drop-shadow(0 0 6px rgba(220,40,40,0.75))";
              return `<ha-icon icon="mdi:dishwasher" style="
                width:34px;
                height:34px;
                color:${color};
                filter:${shadow};
              "></ha-icon>`;
            ]]]
        styles:
          card:
            - width: 42px
            - height: 42px
            - padding: 0
            - background: none
            - box-shadow: none
            - border: none
            - overflow: visible
          custom_fields:
            icon:
              - position: absolute
              - inset: 0
              - display: flex
              - align-items: center
              - justify-content: center
        style:
          top: 32.8%
          left: 43%
      - type: custom:button-card
        entity: sensor.salon_thermometre_salon_temperature
        triggers_update:
          - sensor.salon_thermometre_salon_humidite
        show_name: false
        show_state: false
        show_icon: false
        tap_action:
          action: more-info
        custom_fields:
          room: SALON
          temp: |
            [[[
              const t = parseFloat(entity.state);
              return isNaN(t) ? "--" : `${t.toFixed(1).replace(".", ",")}°`;
            ]]]
          hum_label: HUMIDITÉ
          hum: |
            [[[
              const h = parseFloat(states['sensor.salon_thermometre_salon_humidite']?.state);
              return isNaN(h) ? "-- %" : `${Math.round(h)} %`;
            ]]]
          bar: |
            [[[
              const h = parseFloat(states['sensor.salon_thermometre_salon_humidite']?.state);
              const v = isNaN(h) ? 0 : Math.max(0, Math.min(100, h));
              return `
                <div style="
                  width:100%;
                  height:6px;
                  background:rgba(255,255,255,0.10);
                  border-radius:999px;
                  overflow:hidden;
                ">
                  <div style="
                    width:${v}%;
                    height:100%;
                    border-radius:999px;
                    background:linear-gradient(90deg,
                      rgba(90,160,220,0.92),
                      rgba(170,210,240,0.96)
                    );
                  "></div>
                </div>
              `;
            ]]]
        styles:
          card:
            - width: 145px
            - height: 84px
            - padding: 0
            - border-radius: 18px
            - background: >-
