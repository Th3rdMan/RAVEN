              - font-size: 9px
              - font-weight: 600
              - letter-spacing: 1.6px
            icon:
              - position: absolute
              - left: 14px
              - top: 30px
            temp:
              - position: absolute
              - right: 14px
              - top: 20px
              - color: white
              - font-size: 28px
              - font-weight: 700
              - line-height: 1
            cond:
